name: Kurse
on:
  schedule:
    - cron: "*/15 6-22 * * 1-5"   # werktags alle 15 Minuten (UTC)
    - cron: "0 */3 * * 0,6"        # Wochenende alle 3 Stunden (Krypto)
  workflow_dispatch:
permissions:
  contents: write
concurrency: kurse
jobs:
  kurse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance
      - run: python skripte/kurse.py
      - name: Speichern
        run: |
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
          git add kurse.json
          git diff --cached --quiet && exit 0
          git commit -m "Kurse aktualisiert"
          git pull --rebase -X theirs
          git push
